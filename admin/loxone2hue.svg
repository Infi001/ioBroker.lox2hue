<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="hueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B8DEF"/>
      <stop offset="30%" stop-color="#9B5DE5"/>
      <stop offset="60%" stop-color="#F15BB5"/>
      <stop offset="85%" stop-color="#FB8B24"/>
      <stop offset="100%" stop-color="#FFD23F"/>
    </linearGradient>
    <linearGradient id="loxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8CC63F"/>
      <stop offset="100%" stop-color="#5C9E2E"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded-square background/canvas -->
  <rect x="0" y="0" width="256" height="256" rx="40" fill="#1B1F23"/>

  <!-- Diagonal split: obere/linke Haelfte = Loxone-Anspielung (Gruen, Haus-Symbol) -->
  <clipPath id="clipAll"><rect x="0" y="0" width="256" height="256" rx="40"/></clipPath>
  <g clip-path="url(#clipAll)">
    <polygon points="0,0 256,0 0,256" fill="url(#loxGrad)"/>
    <polygon points="256,0 256,256 0,256" fill="url(#hueGrad)"/>

    <!-- Loxone-Seite: abstraktes Haus-Symbol (kein Marken-Logo) -->
    <g transform="translate(62,58)" fill="#FFFFFF" opacity="0.95">
      <path d="M 0 34 L 34 4 L 68 34 L 68 66 L 0 66 Z" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round"/>
      <circle cx="34" cy="46" r="7" fill="#FFFFFF"/>
    </g>

    <!-- Hue-Seite: abstraktes Gluehbirnen/Licht-Symbol (kein Marken-Logo) -->
    <g transform="translate(150,146)" fill="#FFFFFF" opacity="0.95">
      <circle cx="34" cy="26" r="24" fill="none" stroke="#FFFFFF" stroke-width="7"/>
      <path d="M 22 50 L 46 50" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
      <path d="M 26 58 L 42 58" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
      <path d="M 34 0 L 34 -10" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
      <path d="M 8 26 L -2 26" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
      <path d="M 12 4 L 5 -3" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Mitte: Verbindungs-Symbol auf der Diagonalnaht -->
  <g filter="url(#soft)">
    <circle cx="128" cy="128" r="38" fill="#FFFFFF"/>
    <g stroke="#2B2F33" stroke-width="8" stroke-linecap="round" fill="none">
      <path d="M 108 118 L 148 118"/>
      <path d="M 108 138 L 148 138"/>
      <path d="M 138 108 L 148 118 L 138 128"/>
      <path d="M 118 128 L 108 138 L 118 148"/>
    </g>
  </g>
</svg>
